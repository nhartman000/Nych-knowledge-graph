[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph"
version = "0.5.0"
description = "Kuzu knowledge graph + NYCH 3.0 encoder/harvester (shared store)"
requires-python = ">=3.11"
dependencies = ["kuzu==0.11.3", "jsonschema==4.23.0", "pyyaml>=6", "spacy>=3.7"]

[project.optional-dependencies]
test = ["pytest>=8", "pydantic>=2.8", "click>=8.1"]

[project.scripts]
nych3 = "nych3.cli:main"
nych3-harvest = "nych3.harvest.cli:main"

[tool.setuptools.packages.find]
where = ["shared"]
include = ["nych3*"]

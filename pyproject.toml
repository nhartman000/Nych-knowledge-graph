[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nych3-pro"
version = "3.0.0-pre1"
requires-python = ">=3.11"
dependencies = ["kuzu==0.11.3", "pyyaml>=6"]

[project.optional-dependencies]
spacy = ["spacy>=3.7"]
test = ["pytest>=8", "pydantic>=2.8", "click>=8.1"]

[project.scripts]
nych3 = "nych3.cli:main"
nych3-harvest = "nych3.harvest.cli:main"

[tool.setuptools.packages.find]
where = ["shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["shared"]

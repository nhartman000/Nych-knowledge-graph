name: ci
on:
  push:
    branches: [main, master, nych3-integration]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Optional: private repos. Without them tests/nych3/test_mg8_compat.py is skipped, never failed.
      - name: optional mg8-engine
        continue-on-error: true
        run: pip install --no-deps -r requirements-mg8.txt
      - run: pytest -q
